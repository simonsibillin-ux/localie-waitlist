
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap');
.og-wrap {
  width: 1200px;
  height: 630px;
  background: #0a1628;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 0;
  transform-origin: top left;
}
.glow1 {
  position: absolute;
  top: -180px; left: 50%;
  transform: translateX(-50%);
  width: 700px; height: 700px;
  background: radial-gradient(circle, rgba(26,107,223,0.18) 0%, transparent 65%);
  pointer-events: none;
}
.glow2 {
  position: absolute;
  bottom: -150px; right: -80px;
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(74,158,255,0.07) 0%, transparent 65%);
  pointer-events: none;
}
.content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
  position: relative;
  z-index: 1;
  text-align: center;
}
.logo-row {
  display: flex;
  align-items: center;
  gap: 18px;
}
.logo-img {
  width: 80px; height: 80px;
  border-radius: 22px;
  object-fit: cover;
}
.wordmark {
  font-family: 'DM Serif Display', serif;
  font-size: 64px;
  color: #fff;
  letter-spacing: -1px;
  line-height: 1;
}
.wordmark em { color: #4a9eff; font-style: normal; }
.tagline {
  font-family: 'DM Sans', sans-serif;
  font-size: 24px;
  color: rgba(255,255,255,0.42);
  letter-spacing: 0.2px;
  font-weight: 400;
}
.badges {
  display: flex;
  gap: 12px;
}
.badge {
  font-family: 'DM Sans', sans-serif;
  background: rgba(26,107,223,0.12);
  border: 1px solid rgba(74,158,255,0.2);
  border-radius: 50px;
  padding: 9px 20px;
  font-size: 16px;
  color: #4a9eff;
  font-weight: 500;
}
.divider {
  width: 48px; height: 2px;
  background: rgba(255,255,255,0.08);
  border-radius: 2px;
}
.url {
  font-family: 'DM Sans', sans-serif;
  font-size: 17px;
  color: rgba(255,255,255,0.18);
  letter-spacing: 2px;
  text-transform: uppercase;
}
</style>

<h2 class="sr-only">Localie open graph image — 1200x630 for social media sharing</h2>

<div class="og-wrap" id="ogWrap">
  <div class="glow1"></div>
  <div class="glow2"></div>
  <div class="content">
    <div class="logo-row">
      <img class="logo-img" src="https://localie-sigma.vercel.app/images/logo.png" alt="Localie logo" onerror="this.style.display='none'">
      <div class="wordmark">Local<em>ie</em></div>
    </div>
    <div class="tagline">Trusted local services, all in one place.</div>
    <div class="badges">
      <div class="badge">✓ ABN Verified</div>
      <div class="badge">✓ Insurance Checked</div>
      <div class="badge">✓ Police Checked</div>
    </div>
    <div class="divider"></div>
    <div class="url">localieapp.com</div>
  </div>
</div>

<script>
const wrap = document.getElementById('ogWrap');
function scale() {
  const vw = window.innerWidth;
  const s = Math.min(vw / 1200, 1);
  wrap.style.transform = `scale(${s})`;
  wrap.style.marginBottom = `-${630 * (1 - s)}px`;
}
scale();
window.addEventListener('resize', scale);
</script>
